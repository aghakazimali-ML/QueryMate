# Render Blueprint: deploys the API + bundled frontend as one Docker web service.
# Dashboard: New > Blueprint > pick this repo. Then set GOOGLE_API_KEY (and/or OPENAI_API_KEY).
services:
  - type: web
    name: querymate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://your-querymate.vercel.app
